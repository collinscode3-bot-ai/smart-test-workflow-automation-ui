<div class="header-container d-flex align-items-center bg-white px-4">
  <div class="app-brand me-5">
    <span class="brand-workflow">Smart Workflow</span>
    <span class="brand-automation ms-1">Test Automation</span>
  </div>

  <div class="d-flex flex-column justify-content-center" *ngIf="headerData$ | async as data">
    <h1 class="header-title mb-0">{{ data.title }}</h1>
    <p class="header-description mb-0">{{ data.description }}</p>
  </div>
</div>
