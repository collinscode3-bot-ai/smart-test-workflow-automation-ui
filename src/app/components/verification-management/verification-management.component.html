<div class="col-lg-10 mx-auto py-4">
  <!-- Dynamic Alerts -->
  <div *ngIf="successMessage" class="alert alert-success d-flex align-items-center alert-dismissible fade show mb-4" role="alert" style="border-radius: 8px;">
    <i class="bi bi-check-circle-fill me-2 fw-bold" style="font-size: 1.2rem;"></i>
    <div>{{ successMessage }}</div>
    <button type="button" class="btn-close" (click)="successMessage = null" aria-label="Close"></button>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center alert-dismissible fade show mb-4" role="alert" style="border-radius: 8px;">
    <i class="bi bi-x-circle-fill me-2 fw-bold" style="font-size: 1.2rem;"></i>
    <div>{{ errorMessage }}</div>
    <button type="button" class="btn-close" (click)="errorMessage = null" aria-label="Close"></button>
  </div>

  <div class="card border-0 shadow-sm p-5 mb-5" *ngIf="!isFormVisible">
    <div class="mb-3">
      <h2 class="fw-bold mb-1" style="color: #4B0082;">Verification List</h2>
      <p class="text-muted" style="font-size: 14px;">Review and manage detailed verification steps and parameters for your test case.</p>
    </div>

    <!-- Verification Cards -->
    <div class="verification-list">
      <div *ngFor="let verification of paginatedVerifications"
        (click)="toggleForm('view', verification)"
        class="card border-0 shadow-sm mb-3 px-4 py-3 d-flex flex-row align-items-center justify-content-between verification-card cursor-pointer">

        <div class="d-flex align-items-center">
          <div class="icon-wrapper me-3 d-flex align-items-center justify-content-center">
            <i class="bi bi-file-earmark-text"></i>
          </div>
          <div class="d-flex align-items-center">
            <span class="fw-bold text-dark me-2">{{ verification.verificationName }}</span>
            <span class="text-muted border-start ps-3 ms-1" style="font-size: 14px;">{{ verification.verificationType }}</span>
          </div>
        </div>

        <div class="actions d-flex gap-4 align-items-center">
          <i class="bi bi-eye cursor-pointer action-icon" (click)="toggleForm('view', verification); $event.stopPropagation()" title="View"></i>
          <i class="bi bi-pencil cursor-pointer action-icon" (click)="toggleForm('edit', verification); $event.stopPropagation()" title="Edit"></i>
          <i class="bi bi-trash text-danger cursor-pointer action-icon" (click)="deleteVerification(verification.id); $event.stopPropagation()" title="Delete"></i>
        </div>
      </div>

      <!-- Empty state -->
      <div *ngIf="mockVerifications.length === 0" class="text-center py-5 text-muted italic">
        No verifications available. Please add a new one.
      </div>
    </div>

    <!-- Pagination -->
    <nav *ngIf="totalPages > 1" class="mt-5">
      <ul class="pagination justify-content-center border-0 mb-0">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link border-0 bg-transparent text-muted" (click)="setPage(currentPage - 1)" style="cursor: pointer;">
            <i class="bi bi-chevron-left"></i>
          </a>
        </li>
        <li class="page-item mx-1" *ngFor="let page of pages">
          <a
            class="page-link border-0 d-flex align-items-center justify-content-center"
            (click)="setPage(page)"
            [style.background-color]="currentPage === page ? '#4B0082' : 'transparent'"
            [style.color]="currentPage === page ? 'white' : '#6C757D'"
            style="width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 14px;"
          >
            {{ page }}
          </a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link border-0 bg-transparent text-muted" (click)="setPage(currentPage + 1)" style="cursor: pointer;">
            <i class="bi bi-chevron-right"></i>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Footer Buttons -->
    <div class="d-flex justify-content-start gap-3 mt-5 pt-3">
      <button type="button" class="btn btn-indigo d-flex align-items-center justify-content-center px-4" (click)="toggleForm('new')">
        Add New Verification
      </button>
      <button type="button" class="btn btn-indigo d-flex align-items-center justify-content-center px-4" (click)="saveAllVerifications()">
        Save Verifications
      </button>
      <button type="button" class="btn btn-pumpkin d-flex align-items-center justify-content-center px-4" (click)="onBack()">
        Back to Test Case
      </button>
    </div>
  </div>

  <!-- Form Section -->
  <div *ngIf="isFormVisible">
    <app-verification-details
      [forcedMode]="formMode"
      [editData]="selectedVerification"
      (saveSuccess)="handleSaveSuccess($event)"
      (cancelAction)="handleCancel()">
    </app-verification-details>
  </div>
</div>
