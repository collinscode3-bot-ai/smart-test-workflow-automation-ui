<div class="modal-backdrop-custom d-flex align-items-center justify-content-center">
  <div class="modal-container-custom shadow-lg">
    <!-- Header Section -->
    <div class="px-5 pt-5 pb-4">
      <h2 class="fw-bold mb-1" style="color: #4B0082; font-size: 2rem;">
        Verification Parameter Configuration
      </h2>
      <p class="text-muted" style="font-size: 16px;">Define the technical parameters for the selected verification step.</p>
    </div>

    <!-- Form Section -->
    <div class="px-5 py-4 border-top">
      <!-- Dynamic Alerts -->
      <div *ngIf="successMessage" class="alert alert-success d-flex align-items-center alert-dismissible fade show mb-4" role="alert" style="border-radius: 8px;">
        <i class="bi bi-check-circle-fill me-2 fw-bold" style="font-size: 1.2rem;"></i>
        <div>{{ successMessage }}</div>
        <button type="button" class="btn-close" (click)="successMessage = null" aria-label="Close"></button>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center alert-dismissible fade show mb-4" role="alert" style="border-radius: 8px;">
        <i class="bi bi-x-circle-fill me-2 fw-bold" style="font-size: 1.2rem;"></i>
        <div>{{ errorMessage }}</div>
        <button type="button" class="btn-close" (click)="errorMessage = null" aria-label="Close"></button>
      </div>

      <form [formGroup]="parameterForm">
        <!-- Row 1 -->
        <div class="row mb-4">
          <div class="col-md-6">
            <div class="form-group">
              <label for="parameterSeqNo" class="modal-label">Seq No <span class="text-danger">*</span></label>
              <input type="text" id="parameterSeqNo" formControlName="parameterSeqNo" class="form-control" placeholder="e.g. 1">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="parameterId" class="modal-label">Param Key <span class="text-danger">*</span></label>
              <input type="text" id="parameterId" formControlName="parameterId" class="form-control" placeholder="Enter key name">
            </div>
          </div>
        </div>

        <!-- Row 2 -->
        <div class="row mb-4">
          <div class="col-md-6">
            <div class="form-group">
              <label for="parameterType" class="modal-label">Param Value Source <span class="text-danger">*</span></label>
              <select id="parameterType" formControlName="parameterType" class="form-select">
                <option value="" disabled selected>Select Param Source</option>
                <option value="TDV">Test Data Value</option>
                <option value="STATIC_VALUE">Static Value</option>
                <option value="HEADER_KEY">Header Key</option>
              </select>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="dataType" class="modal-label">Value Data Type <span class="text-danger">*</span></label>
              <select id="dataType" formControlName="dataType" class="form-select">
                <option value="" disabled selected>Select data type</option>
                <option value="String">String</option>
                <option value="Number">Number</option>
                <option value="Boolean">Boolean</option>
                <option value="JSON">JSON</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Row 3 -->
        <div class="row mb-4">
          <div class="col-md-6">
            <div class="form-group">
              <label for="parameterValuePath" class="modal-label">Param Value Path <span class="text-danger">*</span></label>
              <input type="text" id="parameterValuePath" formControlName="parameterValuePath" class="form-control" placeholder="Enter value path">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="parameterValue" class="modal-label">Param Value <span class="text-danger">*</span></label>
              <input type="text" id="parameterValue" formControlName="parameterValue" class="form-control" placeholder="Enter value">
            </div>
          </div>
        </div>
      </form>
    </div>

    <!-- Footer Section -->
    <div class="px-5 py-5 d-flex justify-content-end align-items-center gap-4 bg-light-gray rounded-bottom">
      <button type="button" class="btn btn-outline-secondary fw-bold" style="height: 50px; min-width: 160px; border-radius: 8px;" (click)="onCancel()">
        {{ mode === 'view' ? 'Close' : 'Cancel' }}
      </button>
      <button *ngIf="mode !== 'view'" type="button" class="btn btn-save-parameter d-flex align-items-center justify-content-center gap-2" (click)="onSave()" [disabled]="parameterForm.invalid">
        <span>Save Parameter</span>
      </button>
    </div>
  </div>
</div>
