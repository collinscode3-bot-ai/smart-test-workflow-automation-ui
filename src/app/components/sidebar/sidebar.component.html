<div class="sidebar-container bg-white border-end">
  <div class="sidebar-menu mt-3">
    <div *ngFor="let section of menuItems" class="menu-section">
      <!-- Main Section Header -->
      <div
        class="menu-item d-flex align-items-center justify-content-between p-3 px-4"
        (click)="toggleSection(section)"
        [class.expanded]="section.isExpanded"
      >
        <div class="d-flex align-items-center">
          <i [class]="section.icon" class="me-3 fs-5"></i>
          <span class="fw-semibold">{{ section.label }}</span>
        </div>
        <i class="bi bi-chevron-down chevron-icon" [class.rotated]="section.isExpanded"></i>
      </div>

      <!-- Sub-links -->
      <div class="sub-menu" [class.show]="section.isExpanded">
        <div class="list-group list-group-flush">
          <a
            *ngFor="let subLink of section.subLinks"
            [routerLink]="subLink.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}"
            class="list-group-item list-group-item-action border-0 ps-5"
          >
            {{ subLink.label }}
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
