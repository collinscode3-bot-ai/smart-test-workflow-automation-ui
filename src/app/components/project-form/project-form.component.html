<div class="card border-0 shadow-sm p-5">
  <h2 class="fw-bold mb-4" style="color: #4B0082;">{{ mode === 'edit' ? 'Update Project' : 'Create New Project' }}</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-md-11">
        <div class="mb-4">
          <label for="projectName" class="form-label">Project Name</label>
          <input type="text" id="projectName" class="form-control" placeholder="Enter project name">
        </div>

        <div class="mb-4">
          <label for="projectDetails" class="form-label">Project Details</label>
          <textarea id="projectDetails" class="form-control" rows="4" style="height: auto;" placeholder="Describe the project objective"></textarea>
        </div>

        <div class="mb-4">
          <label for="category" class="form-label">Category</label>
          <select id="category" class="form-select">
            <option selected disabled>Select category</option>
            <option value="web">Web Development</option>
            <option value="mobile">Mobile App</option>
            <option value="design">UI/UX Design</option>
          </select>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-3 mt-2">
      <button type="submit" [class]="mode === 'edit' ? 'btn btn-theme-purple' : 'btn btn-theme-orange'">
        {{ mode === 'edit' ? 'Update Project' : 'Add Project' }}
      </button>
      <button type="button" class="btn btn-outline-secondary" style="min-width: 160px; height: 50px; border-radius: 8px;">Cancel</button>
    </div>
  </form>
</div>
