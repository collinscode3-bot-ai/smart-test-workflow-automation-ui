<div class="card border-0 shadow-sm p-5">
  <h2 class="fw-bold mb-2" style="color: #4B0082;">{{ mode === 'edit' ? 'Update Project' : 'Create New Project' }}</h2>
  <p class="mb-4" style="font-size: 14px; color: #6C757D;">
    Create, edit, and manage your automation project configurations and metadata.
  </p>

  <form [formGroup]="projectForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-md-12">
        <div class="mb-4">
          <label for="projectName" class="form-label">Project Name <span class="text-danger">*</span></label>
          <input
            type="text"
            id="projectName"
            formControlName="projectName"
            class="form-control"
            [ngClass]="{'is-invalid': projectForm.get('projectName')?.invalid && projectForm.get('projectName')?.dirty}"
            placeholder="Enter project name">
          <div *ngIf="projectForm.get('projectName')?.invalid && projectForm.get('projectName')?.dirty" class="text-danger small mt-1">
            Project Name is Mandatory
          </div>
        </div>

        <div class="mb-4">
          <label for="projectDetails" class="form-label">Project Details <span class="text-danger">*</span></label>
          <textarea
            id="projectDetails"
            formControlName="projectDescription"
            class="form-control"
            rows="4"
            style="height: auto;"
            [ngClass]="{'is-invalid': projectForm.get('projectDescription')?.invalid && projectForm.get('projectDescription')?.dirty}"
            placeholder="Describe the project objective"></textarea>
          <div *ngIf="projectForm.get('projectDescription')?.invalid && projectForm.get('projectDescription')?.dirty" class="text-danger small mt-1">
            Project Description is Mandatory
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-center gap-3 mt-2">
      <button
        type="submit"
        class="btn"
        [ngClass]="mode === 'edit' ? 'btn-theme-purple' : 'btn-theme-orange'"
        [disabled]="projectForm.invalid">
        {{ mode === 'edit' ? 'Update Project' : 'Add Project' }}
      </button>
      <button type="button" class="btn btn-outline-secondary" style="min-width: 160px; height: 50px; border-radius: 8px;" routerLink="/projects/dashboard">Cancel</button>
    </div>
  </form>
</div>
