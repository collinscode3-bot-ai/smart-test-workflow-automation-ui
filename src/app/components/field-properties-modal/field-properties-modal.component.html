<div class="modal-backdrop-custom d-flex align-items-center justify-content-center">
  <div class="modal-container-custom shadow-lg">
    <!-- Header Section -->
    <div class="px-5 pt-5 pb-4">
      <h2 class="fw-bold mb-1" style="color: #4B0082; font-size: 2rem;">FIELD PROPERTIES</h2>
      <p class="text-muted" style="font-size: 16px;">Manage rules for individual fields.</p>
    </div>

    <!-- Form Section -->
    <div class="px-5 py-4 border-top">
      <form [formGroup]="propertyForm">
        <!-- Row 1 -->
        <div class="row mb-4">
          <div class="col-md-6">
            <div class="form-group">
              <label for="modalKey" class="modal-label" style="color: #4B0082; font-weight: bold; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px;">Key</label>
              <mat-form-field appearance="fill" class="field-properties-autocomplete w-100">
                <input type="text"
                       id="modalKey"
                       placeholder="e.g. userId"
                       matInput
                       formControlName="key"
                       [matAutocomplete]="auto">
                <mat-autocomplete #auto="matAutocomplete">
                  <mat-option *ngFor="let key of filteredKeys$ | async" [value]="key">
                    {{ key }}
                  </mat-option>
                </mat-autocomplete>
              </mat-form-field>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="fieldDataType" class="modal-label">Field Data Type</label>
              <select id="fieldDataType" formControlName="fieldDataType" class="form-select">
                <option value="String">String</option>
                <option value="Number">Number</option>
                <option value="Boolean">Boolean</option>
                <option value="Object">Object</option>
                <option value="Array">Array</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Row 2 -->
        <div class="row mb-4">
          <div class="col-md-6">
            <div class="form-group">
              <label for="fieldValueType" class="modal-label">Field Value Type</label>
              <input type="text" id="fieldValueType" formControlName="fieldValueType" class="form-control" placeholder="e.g. UUID">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="fieldGenerationType" class="modal-label">Field Generation Type</label>
              <input type="text" id="fieldGenerationType" formControlName="fieldGenerationType" class="form-control" placeholder="Random">
            </div>
          </div>
        </div>

        <!-- Row 3 (Full-Width) -->
        <div class="row mb-4">
          <div class="col-12">
            <div class="form-group">
              <label for="fieldFormat" class="modal-label">Field Format</label>
              <input type="text" id="fieldFormat" formControlName="fieldFormat" class="form-control" placeholder="e.g. [a-z0-9]{8}">
              <!-- Regex validation logic placeholder: Implement pattern validator if needed -->
            </div>
          </div>
        </div>

        <!-- Toggles Section -->
        <div class="d-flex gap-5 mt-2 border-top pt-4">
          <div class="d-flex align-items-center gap-3">
            <div class="form-check form-switch p-0 m-0 d-flex align-items-center gap-2">
              <input class="form-check-input ms-0 custom-switch" type="checkbox" id="isMandatory" formControlName="isMandatory">
              <label class="form-check-label fw-bold text-uppercase mb-0" for="isMandatory" style="font-size: 12px; letter-spacing: 0.5px; color: #333;">IS MANDATORY</label>
            </div>
          </div>
          <div class="d-flex align-items-center gap-3">
            <div class="form-check form-switch p-0 m-0 d-flex align-items-center gap-2">
              <input class="form-check-input ms-0 custom-switch" type="checkbox" id="autoGenerated" formControlName="autoGenerated">
              <label class="form-check-label fw-bold text-uppercase mb-0" for="autoGenerated" style="font-size: 12px; letter-spacing: 0.5px; color: #333;">AUTOGENERATED</label>
            </div>
          </div>
        </div>
      </form>
    </div>

    <!-- Footer Section -->
    <div class="px-5 py-5 d-flex justify-content-end align-items-center gap-4 bg-light-gray rounded-bottom">
      <button type="button" class="btn btn-link text-decoration-none text-muted fw-bold px-0" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn btn-save-property d-flex align-items-center justify-content-center gap-2" (click)="onSave()" [disabled]="propertyForm.invalid">
        <i class="bi bi-save-fill"></i>
        <span>Save Property</span>
      </button>
    </div>
  </div>
</div>
