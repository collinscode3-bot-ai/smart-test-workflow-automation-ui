<div *ngIf="isLoading$ | async" class="please-wait-overlay">
  <div class="text-center">
    <div class="spinner-border" role="status" style="width: 3rem; height: 3rem; color: #4B0082;">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3 fw-bold" style="color: #4B0082;">Please wait...</p>
  </div>
</div>
